services:
  api:
    build: .
    environment:
      RAG_CHUNKS_PATH: /app/data/processed/chunks.jsonl
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
