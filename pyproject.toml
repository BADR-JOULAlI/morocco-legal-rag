[project]
name = "morocco-legal-rag"
version = "0.1.0"
description = "Multilingual retrieval-augmented generation for public Moroccan legal documents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pymupdf>=1.24",
  "requests>=2.32",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pillow>=10.4"]
qdrant = ["qdrant-client>=1.12"]
ui = ["gradio>=5.0"]
ml = ["numpy>=2.0", "sentence-transformers>=3.0", "torch>=2.3", "transformers>=4.44"]
notebooks = [
  "beautifulsoup4>=4.12",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.5",
]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "nbqa>=1.9"]

[project.scripts]
morocco-legal-api = "morocco_legal_rag.api:run"
morocco-legal-ui = "morocco_legal_rag.ui:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/morocco_legal_rag"]
